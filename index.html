<!--
=============================================================================
PROJEKT / APLIKACE: QuizApp v1 - Prototyp a Základní Rozhraní
FÁZE / LEKCE: Fáze 1 – Prototyp rozhraní a OOP logika jedné otázky
=============================================================================

O APLIKACI:
Interaktivní prototyp kvízové webové aplikace zaměřený na zobrazení a vyhodnocení
jedné otázky s výběrem ze 4 možností. Důraz je kladen na přístupnost (A11y),
čistý sémantický HTML5 layout s Flexboxem a základy objektově orientovaného
programování v JavaScriptu (třída Question).

VÝUKOVÉ CÍLE A FUNKCIONALITA FÁZE:
- Vytvoření sémantického HTML5 dokumentu s kartou otázky a tlačítky odpovědí
- Stylování přístupného rozhraní pomocí moderního Flexboxu a CSS proměnných
- Zajištění vysokého kontrastu (WCAG AA), velkých klikacích ploch a focus stavů
- Implementace ES6 třídy Question (konstruktor, ukládání dat, metoda pro vykreslení)
- Zpracování kliknutí na tlačítka odpovědí a výpis vyhodnocení do konzole prohlížeče

KLÍČOVÁ TÉMATA:
- HTML/CSS: Sémantické značky (<header>, <main>, <section>, <article>, <button>), Flexbox layout, A11y kontrast a velikost tlačítek
- JavaScript: OOP třída (class Question, constructor), DOM selektory (querySelector, querySelectorAll), textContent, Event Listeners

NÁVOD PRO STUDENTY:
- Pro samostatné procvičování přepněte v hlavičce <head> odkaz na styles-students.css a na konci těla na script-students.js.
- V souborech *-students.* doplňte kód podle očíslovaných úkolů TODO a nápověd.
=============================================================================
-->
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizApp v1 – Prototyp a Základní Rozhraní</title>
    
    <!-- Google Fonts: Lexend (vysoká čitelnost a přístupnost) a Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Stylopis aplikace (pro studentskou verzi přepněte na href="styles-students.css") -->
    <link rel="stylesheet" href="styles.css">
    <!-- <link rel="stylesheet" href="styles-students.css"> -->
</head>
<body>

    <!-- Záhlaví aplikace -->
    <header class="app-header">
        <div class="header-container">
            <h1 class="app-title">🧠 QuizApp</h1>
            <span class="badge-phase">Fáze 1: Prototyp</span>
        </div>
    </header>

    <!-- Hlavní obsah stránky -->
    <main class="main-content">
        <!-- Sekce kvízu -->
        <section id="quiz-container" aria-label="Kvízový panel">
            
            <!-- Karta s otázkou -->
            <article id="question-card" class="card">
                <header class="card-header">
                    <span class="question-badge">Otázka 1</span>
                    <h2 id="question-text" class="question-text">Načítám otázku...</h2>
                </header>

                <!-- Mřížka s tlačítky možností -->
                <div id="answers-grid" class="answers-grid" role="group" aria-label="Možnosti odpovědí">
                    <button type="button" class="answer-btn" data-index="0" aria-label="Možnost A">
                        <span class="option-label">A</span>
                        <span class="option-text">Odpověď 1</span>
                    </button>
                    <button type="button" class="answer-btn" data-index="1" aria-label="Možnost B">
                        <span class="option-label">B</span>
                        <span class="option-text">Odpověď 2</span>
                    </button>
                    <button type="button" class="answer-btn" data-index="2" aria-label="Možnost C">
                        <span class="option-label">C</span>
                        <span class="option-text">Odpověď 3</span>
                    </button>
                    <button type="button" class="answer-btn" data-index="3" aria-label="Možnost D">
                        <span class="option-label">D</span>
                        <span class="option-text">Odpověď 4</span>
                    </button>
                </div>
            </article>

            <!-- Nápověda / stavový panel pro vývojáře a studenty -->
            <aside class="dev-hint-panel" aria-live="polite">
                <p>💡 <strong>Tip pro vývojáře:</strong> Otevři vývojářskou konzoli (klávesa <code>F12</code> &rarr; záložka <em>Console</em>) a klikni na libovolnou odpověď pro kontrolu výsledku.</p>
            </aside>

        </section>
    </main>

    <!-- Patička stránky -->
    <footer class="app-footer">
        <p>QuizApp v1 &bull; Výukový prototyp od Vlka samotáře &bull; Licence GNU AGPL-3.0</p>
    </footer>

    <!-- Logika aplikace (pro studentskou verzi přepněte na src="script-students.js") -->
    <script src="script.js"></script>
    <!-- <script src="script-students.js"></script> -->
</body>
</html>
